<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip — PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif; background:#090d16; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { width:100%; max-width:520px; background:#111827; border-radius:20px; padding:25px; border:1px solid #fbbf24; box-shadow:0 0 30px rgba(251,191,36,.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#fbbf24; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(251,191,36,.1); border-radius:999px; margin-bottom:15px; }
.coin { width:170px; height:170px; margin:24px auto; background:radial-gradient(circle at 30% 30%, #fde68a, #f59e0b); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#78350f; font-weight:800; box-shadow:0 0 40px rgba(251,191,36,.4); }
.coin.flipping { animation:spin .7s ease-out; }
@keyframes spin { 0%{transform:rotateY(0)} 50%{transform:rotateY(180deg)} 100%{transform:rotateY(360deg)} }
.btn { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#78350f; border:none; padding:14px 40px; font-weight:800; font-size:1.2rem; border-radius:999px; cursor:pointer; }
.choices { display:flex; gap:12px; justify-content:center; margin:14px 0 20px; }
.choice { padding:10px 26px; border-radius:999px; border:2px solid #4f2933; cursor:pointer; font-weight:700; color:#b08c5a; background:transparent; transition:all .15s; }
.choice.active { border-color:#fbbf24; color:#fbbf24; background:rgba(251,191,36,.1); }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>🪙 Coin Flip</h1>
  <p>Сделай ставку на орла или решку!</p>
  <div class="coin" id="coin">🪙</div>
  <div class="choices">
    <button class="choice active" id="cHead" onclick="choose('Орёл', 'cHead')">🦅 Орёл</button>
    <button class="choice" id="cTail" onclick="choose('Решка', 'cTail')">🦆 Решка</button>
  </div>
  <button class="btn" id="flipBtn">Подбросить</button>
</div>
<script>
var coin=document.getElementById('coin');
var flipBtn=document.getElementById('flipBtn');
var guess='Орёл';

function choose(label, id){
  guess=label;
  document.getElementById('cHead').classList.toggle('active', id==='cHead');
  document.getElementById('cTail').classList.toggle('active', id==='cTail');
}

flipBtn.addEventListener('click', function(){
  coin.classList.remove('flipping');
  void coin.offsetWidth;
  coin.classList.add('flipping');
  setTimeout(function(){
    var side=Math.random()<0.5?'Орёл':'Решка';
    coin.classList.remove('flipping');
    coin.textContent=side==='Орёл'?'🦅':'🐆';
    alert(side+'!'+(side===guess?' Ты угадал! 🎉':' Не угадал 😅'));
  }, 700);
});
</script>
</body>
</html>
