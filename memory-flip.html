<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Memory Flip - PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #831843; color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { max-width: 750px; width:100%; background: #500724; border-radius: 20px; padding: 25px; border: 1px solid #f472b6; box-shadow: 0 0 30px rgba(244,114,182,0.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#fbcfe8; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(251,207,232,0.1); border-radius:999px; margin-bottom:15px; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; margin:20px 0; }
.card { height:90px; background:#9d174d; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; cursor:pointer; user-select:none; border:2px solid #f472b6; transition:transform 0.3s; }
.card.flipped { background:#f472b6; transform:rotateY(180deg); }
.hud { display:flex; justify-content:space-between; font-weight:800; font-size:1.3rem; color:#fbcfe8; margin-bottom:15px; }
.btn { background: linear-gradient(135deg, #ec4899, #f472b6); color:#fff; border:none; padding:12px 30px; font-weight:800; font-size:1.1rem; border-radius:999px; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>🎴 Memory Flip</h1>
  <p>Тренировка памяти! Найди все пары одинаковых эмодзи!</p>
  <div class="hud">
    <div id="moves">Ходы: 0</div>
    <div id="pairs">Пары: 0 / 8</div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="btn" id="resetBtn">Новая игра</button>
</div>
<script>
const emojis = ['🐶','🐱','🦊','🐼','🦁','🐯','🐸','🐵'];
let cards = [...emojis, ...emojis];
let flipped = [], matched = 0, moves = 0, lock = false;

const gridEl = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const resetBtn = document.getElementById('resetBtn');

function shuffle(arr) { return arr.sort(() => 0.5 - Math.random()); }

function init() {
  gridEl.innerHTML = ''; flipped = []; matched = 0; moves = 0; lock = false;
  movesEl.textContent = `Ходы: 0`; pairsEl.textContent = `Пары: 0 / 8`;
  cards = shuffle(cards);

  cards.forEach((emoji, idx) => {
    let c = document.createElement('div');
    c.className = 'card'; c.dataset.idx = idx; c.dataset.emoji = emoji;
    c.addEventListener('click', () => flip(c));
    gridEl.appendChild(c);
  });
}

function flip(card) {
  if (lock || card.classList.contains('flipped') || flipped.includes(card)) return;
  card.classList.add('flipped'); card.textContent = card.dataset.emoji;
  flipped.push(card);

  if (flipped.length === 2) {
    moves++; movesEl.textContent = `Ходы: ${moves}`;
    if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
      matched++; pairsEl.textContent = `Пары: ${matched} / 8`; flipped = [];
      if (matched === 8) setTimeout(() => alert(`🎉 Победа! За ${moves} ходов!`), 300);
    } else {
      lock = true;
      setTimeout(() => {
        flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
        flipped = []; lock = false;
      }, 900);
    }
  }
}

resetBtn.addEventListener('click', init);
init();
</script>
</body>
</html>
