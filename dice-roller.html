<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller — PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Plus Jakarta Sans',sans-serif; background:#090d16; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { width:100%; max-width:520px; background:#111827; border-radius:20px; padding:25px; border:1px solid #38bdf8; box-shadow:0 0 30px rgba(56,189,248,.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#38bdf8; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(56,189,248,.1); border-radius:999px; margin-bottom:15px; }
.dice-area { display:flex; justify-content:center; gap:18px; margin:22px 0; min-height:170px; align-items:center; }
.die { width:130px; height:130px; background:#0f172a; border:3px solid #38bdf8; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:4.2rem; font-weight:800; color:#38bdf8; text-shadow:0 0 20px rgba(56,189,248,.6); transition:transform .1s; }
.die.roll { transform:rotate(18deg) scale(0.9); }
.btn { background:linear-gradient(135deg,#38bdf8,#7c6cff); color:#fff; border:none; padding:14px 40px; font-weight:800; font-size:1.2rem; border-radius:999px; cursor:pointer; }
.total { font-size:1.2rem; color:#94a3b8; margin-top:14px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>🎲 Dice Roller</h1>
  <p>Бросай кубики — идеально для настолок!</p>
  <div class="dice-area">
    <div class="die" id="d1">6</div>
    <div class="die" id="d2">6</div>
  </div>
  <button class="btn" id="rollBtn">🎲 Бросить</button>
  <div class="total" id="total">Сумма: 12</div>
</div>
<script>
var d1=document.getElementById('d1');
var d2=document.getElementById('d2');
var totalEl=document.getElementById('total');
var rollBtn=document.getElementById('rollBtn');
var rolling=false;

rollBtn.addEventListener('click', function(){
  if(rolling) return;
  rolling=true;
  var n=0;
  var anim=setInterval(function(){
    d1.textContent=1+Math.floor(Math.random()*6);
    d2.textContent=1+Math.floor(Math.random()*6);
    d1.classList.add('roll'); d2.classList.add('roll');
    n++;
    if(n>8){
      clearInterval(anim);
      var r1=1+Math.floor(Math.random()*6);
      var r2=1+Math.floor(Math.random()*6);
      d1.textContent=r1; d2.textContent=r2;
      d1.classList.remove('roll'); d2.classList.remove('roll');
      totalEl.textContent='Сумма: '+(r1+r2);
      rolling=false;
    }
  },80);
});
</script>
</body>
</html>
