<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --blue-light: #3b82f6;
  --blue-500: #0ea5e9;
  --blue-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
  --blue-50: #eff6ff;
  --blue-100: #dbeafe;
  --blue-200: #bfdbfe;

  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;

  --telegram: #0088cc;
  --telegram-hover: #0077b5;
  --telegram-gradient: linear-gradient(135deg, #0088cc 0%, #229ed9 100%);

  --font: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 22px;
  --radius-2xl: 28px;
  --radius-full: 999px;

  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 3px 8px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1), 0 3px 8px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12), 0 6px 16px rgba(15, 23, 42, 0.06);
  --shadow-xl: 0 32px 64px rgba(15, 23, 42, 0.16), 0 12px 24px rgba(15, 23, 42, 0.08);

  --glow-blue: 0 0 0 1px var(--blue-200), 0 8px 24px rgba(37, 99, 235, 0.18);
  --glow-tg: 0 0 0 1px rgba(0, 136, 204, 0.25), 0 8px 24px rgba(0, 136, 204, 0.2);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-fast: 150ms var(--ease);
  --t-base: 250ms var(--ease);
  --t-slow: 400ms var(--ease);
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: var(--font);
  background: var(--gray-50);
  color: var(--gray-900);
  min-height: 100vh;
  overflow-x: hidden;
  letter-spacing: -0.02em;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

::selection {
  background: var(--blue-200);
  color: var(--gray-900);
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--gray-100);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb {
  background: var(--gray-300);
  border-radius: 4px;
  transition: background var(--t-fast);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gray-400);
}

.cloud-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background: linear-gradient(180deg, #f0f5ff 0%, #f8fafc 30%, #f1f5f9 100%);
}

.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 50%;
  filter: blur(50px);
  animation: floatCloud linear infinite;
  box-shadow: 0 24px 48px rgba(37, 99, 235, 0.04);
}

.cloud:nth-child(1) { width: 420px; height: 130px; top: 4%; left: -10%; animation-duration: 42s; }
.cloud:nth-child(2) { width: 340px; height: 105px; top: 13%; left: 30%; animation-duration: 52s; animation-delay: -10s; }
.cloud:nth-child(3) { width: 520px; height: 150px; top: 7%; left: 60%; animation-duration: 58s; animation-delay: -20s; }
.cloud:nth-child(4) { width: 360px; height: 115px; top: 24%; left: 80%; animation-duration: 48s; animation-delay: -5s; }
.cloud:nth-child(5) { width: 460px; height: 140px; top: 2%; left: 45%; animation-duration: 62s; animation-delay: -30s; }
.cloud:nth-child(6) { width: 290px; height: 95px; top: 19%; left: 12%; animation-duration: 38s; animation-delay: -15s; }

@keyframes floatCloud {
  0% { transform: translateX(-120px); }
  100% { transform: translateX(calc(100vw + 240px)); }
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(226, 232, 240, 0.5);
  padding: 0 1.5rem;
  transition: box-shadow var(--t-base);
}

header:hover {
  box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  gap: 1rem;
  padding: 0 1.5rem;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--t-fast);
  min-width: 0;
  flex-shrink: 0;
}

.logo-area:hover { opacity: 0.85; }

.logo-area img {
  height: 38px;
  width: 38px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--blue-100);
  box-shadow: var(--shadow-sm);
}

.logo-area .logo-placeholder {
  height: 38px;
  width: 38px;
  border-radius: var(--radius-sm);
  background: var(--blue-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-weight: 800;
  font-size: 15px;
  box-shadow: var(--shadow-sm);
}

.logo-text {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--blue-dark), var(--blue-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

nav {
  display: flex;
  align-items: center;
  gap: 4px;
}

nav .search-btn {
  display: flex;
}

nav .desktop-only {
  display: flex;
}

.header-mobile-actions {
  display: none;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  position: relative;
  z-index: 120;
}

.header-mobile-actions .search-btn,
.header-mobile-actions .hamburger {
  display: flex;
}

nav a,
nav .nav-btn {
  text-decoration: none;
  color: var(--gray-700);
  font-weight: 600;
  font-size: 0.88rem;
  padding: 9px 16px;
  border-radius: var(--radius-full);
  border: none;
  background: none;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: -0.01em;
  transition: background var(--t-fast), color var(--t-fast);
}

nav a:hover,
nav .nav-btn:hover {
  background: var(--blue-50);
  color: var(--blue);
}

.nav-dropdown {
  position: relative;
}

.nav-dropdown .dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 210px;
  margin-top: 10px;
  padding: 6px;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(24px);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 200;
  animation: dropdownIn var(--t-base) ease-out;
}

.nav-dropdown:hover .dropdown-menu {
  display: block;
}

@keyframes dropdownIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

nav .dropdown-menu a {
  display: block;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  color: var(--gray-700);
  font-size: 0.88rem;
  font-weight: 600;
  transition: background var(--t-fast), color var(--t-fast), padding-left var(--t-fast);
}

nav .dropdown-menu a:hover {
  background: var(--blue-50);
  color: var(--blue);
  padding-left: 20px;
}

.tg-nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--telegram-gradient) !important;
  color: #ffffff !important;
  font-weight: 700 !important;
  font-size: 0.85rem !important;
  border-radius: var(--radius-full) !important;
  padding: 9px 18px !important;
  box-shadow: 0 4px 16px rgba(0, 136, 204, 0.3);
  transition: transform var(--t-base), box-shadow var(--t-base) !important;
  position: relative;
  overflow: hidden;
}

.tg-nav-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(0, 136, 204, 0.4);
}

.tg-nav-btn:active {
  transform: translateY(0) scale(0.96);
}

.search-btn {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-full);
    border: 1px solid rgba(226, 232, 240, 0.8);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.05rem;
    color: var(--gray-500);
    box-shadow: var(--shadow-xs);
    transition: all var(--t-base);
  }

  .search-btn:hover {
    border-color: var(--blue-200);
    background: var(--blue-50);
    color: var(--blue);
    transform: scale(1.08);
    box-shadow: var(--shadow-sm);
  }

  .search-btn:active {
    transform: scale(0.94);
  }

  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 44px;
    height: 44px;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    background: #ffffff;
    cursor: pointer;
    padding: 10px 12px;
    align-items: center;
    justify-content: center;
    transition: all var(--t-fast);
    z-index: 110;
  }

  .hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--gray-700);
    border-radius: 2px;
    transition: all var(--t-base);
    transform-origin: center;
  }

  .hamburger.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }

  .hamburger.active span:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
  }

  .hamburger:hover {
    background: var(--gray-100);
    border-color: var(--gray-300);
  }

  .mobile-nav {
    position: fixed;
    top: 0;
    right: -100%;
    width: min(340px, 85vw);
    height: 100vh;
    height: 100dvh;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 150;
    padding: 80px 24px 24px;
    transition: right var(--t-slow);
    box-shadow: var(--shadow-xl);
    border-left: 1px solid rgba(226, 232, 240, 0.6);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mobile-nav.open {
    right: 0;
  }

  .mobile-nav-inner {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .mobile-nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    color: var(--gray-700);
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: all var(--t-fast);
    cursor: pointer;
  }

  .mobile-nav-link:hover {
    background: var(--blue-50);
    color: var(--blue);
    padding-left: 22px;
  }

  .mobile-nav-search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    background: var(--gray-100);
    color: var(--gray-700);
    font-weight: 600;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--t-fast);
    margin-top: 8px;
  }

  .mobile-nav-search:hover {
    background: var(--blue-50);
    color: var(--blue);
  }

  .mobile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    z-index: 140;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-slow);
  }

  .mobile-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(4rem, 9vw, 7rem) 1.5rem clamp(3rem, 6vw, 4.5rem);
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: -160px;
  left: 50%;
  transform: translateX(-50%);
  width: min(800px, 90vw);
  height: 500px;
  background: radial-gradient(ellipse at center, rgba(37, 99, 235, 0.12) 0%, rgba(96, 165, 250, 0.06) 40%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: var(--radius-full);
  background: rgba(239, 246, 255, 0.9);
  border: 1px solid var(--blue-200);
  color: var(--blue);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  box-shadow: var(--shadow-xs);
  margin-bottom: 2rem;
  animation: fadeUp 0.5s var(--ease) both;
}

.hero-badge .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue);
  animation: ping 1.8s ease-out infinite;
}

@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
  70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
  100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
}

.hero h1 {
  font-size: clamp(2.6rem, 5.5vw, 4.4rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.045em;
  color: var(--gray-900);
  margin-bottom: 1.4rem;
  animation: fadeUp 0.6s var(--ease) 0.08s both;
}

.hero h1 span {
  background: var(--blue-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero p {
  font-size: clamp(1.05rem, 1.8vw, 1.2rem);
  color: var(--gray-500);
  max-width: 640px;
  margin: 0 auto 2.8rem;
  line-height: 1.75;
  letter-spacing: -0.015em;
  animation: fadeUp 0.6s var(--ease) 0.16s both;
}

.hero-actions {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp 0.6s var(--ease) 0.24s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 32px;
  border-radius: var(--radius-full);
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  border: none;
  position: relative;
  overflow: hidden;
  transition: transform var(--t-base), box-shadow var(--t-base), background var(--t-base), border-color var(--t-base), color var(--t-base);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -80%;
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: skewX(-20deg);
  transition: left 0.55s ease;
  pointer-events: none;
}

.btn:hover::after {
  left: 140%;
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: var(--blue-gradient);
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(37, 99, 235, 0.38);
}

.btn-telegram {
  background: var(--telegram-gradient);
  color: #ffffff;
  box-shadow: 0 8px 22px rgba(0, 136, 204, 0.3);
}

.btn-telegram:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 30px rgba(0, 136, 204, 0.42);
}

.btn-secondary {
  background: #ffffff;
  color: var(--gray-700);
  border: 1.5px solid var(--gray-200);
  box-shadow: var(--shadow-xs);
}

.btn-secondary:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: var(--blue-50);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.btn-secondary:active {
  background: var(--blue-100);
}

.btn-block {
  display: flex;
  width: 100%;
  justify-content: center;
  padding: 16px 28px;
  font-size: 1rem;
  border-radius: var(--radius-lg);
}

.btn-ghost {
  background: transparent;
  color: var(--gray-700);
  border: 1.5px solid transparent;
  padding: 12px 24px;
}

.btn-ghost:hover {
  background: var(--gray-100);
  color: var(--gray-900);
  transform: translateY(-2px);
}

.section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 3.5rem;
}

.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 2.2rem;
}

.section-title {
  font-size: clamp(1.5rem, 3vw, 2.1rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.15;
  color: var(--gray-900);
}

.section-title::after {
  content: '';
  display: block;
  width: 46px;
  height: 4px;
  margin-top: 12px;
  border-radius: var(--radius-full);
  background: var(--blue-gradient);
}

.section-subtitle {
  color: var(--gray-500);
  font-size: 0.92rem;
  margin-top: 8px;
  letter-spacing: -0.01em;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 20px;
}

.card {
  background: #ffffff;
  border: 1px solid rgba(226, 232, 240, 0.8);
  border-radius: var(--radius-xl);
  padding: 26px;
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform var(--t-slow), box-shadow var(--t-slow), border-color var(--t-slow), background var(--t-slow);
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--blue-gradient);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--t-slow);
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.03) 0%, transparent 50%);
  opacity: 0;
  transition: opacity var(--t-base);
}

.card:hover::after {
  opacity: 1;
}

.card:hover::before {
  transform: scaleX(1);
}

.card:active {
  transform: translateY(-3px) scale(0.99);
}

.card-icon {
  width: 54px;
  height: 54px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--blue-50), #f0f9ff);
  border: 1px solid rgba(37, 99, 235, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  margin-bottom: 20px;
  box-shadow: var(--shadow-xs);
  transition: transform var(--t-base), box-shadow var(--t-base), background var(--t-base);
}

.card:hover .card-icon {
  transform: scale(1.1) rotate(-4deg);
  box-shadow: var(--shadow-md);
  background: linear-gradient(135deg, var(--blue-100), #e0f2fe);
}

.card h3 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  color: var(--gray-900);
}

.card p {
  font-size: 0.9rem;
  line-height: 1.7;
  color: var(--gray-500);
  flex: 1;
}

.card-tag {
  align-self: flex-start;
  margin-top: 18px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--blue);
  background: var(--blue-50);
  border: 1px solid var(--blue-100);
  padding: 5px 13px;
  border-radius: var(--radius-full);
  transition: background var(--t-fast);
}

.card:hover .card-tag {
  background: var(--blue-100);
}

.quick-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 2.5rem;
}

.quick-link-btn {
  display: flex;
  align-items: center;

            '<span class="card-tag" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">VIP Чат</span>' +
          '</div>' +
          '<div class="card" style="border:1px solid #fde68a;">' +
            '<div class="card-icon" style="background:#fef3c7;">🎮</div>' +
            '<h3>Ранний доступ к Играм</h3>' +
            '<p>Возможность тестировать новые игры и билды за несколько недель до публичного релиза.</p>' +
            '<span class="card-tag" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">Бета Текст</span>' +
          '</div>' +
          '<div class="card" style="border:1px solid #fde68a;">' +
            '<div class="card-icon" style="background:#fef3c7;">⚡</div>' +
            '<h3>Приоритетная поддержка</h3>' +
            '<p>Прямой контакт с администратором для решения любых вопросов по сайту и инструментам.</p>' +
            '<span class="card-tag" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">24/7 VIP</span>' +

    } else if (type === 'tools') {
      html += '<p style="color:var(--gray-500);margin-bottom:1.5rem;">Вставьте ссылку на YouTube видео, чтобы мгновенно получить ссылки на скачивание MP4 (видео) или MP3 (аудио).</p>';
      
      html += '<div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:18px; padding:24px; margin-bottom:2rem; box-shadow:var(--shadow-sm);">' +
        '<h2 style="font-size:1.2rem; font-weight:800; margin-bottom:12px; color:var(--gray-900);">📥 Скачать видео с YouTube</h2>' +
        '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">' +
          '<input type="text" id="ytUrlInput" placeholder="Вставьте ссылку на YouTube (например: https://www.youtube.com/watch?v=dQw4w9WgXcQ)" style="flex:1; min-width:280px; padding:12px 18px; border-radius:12px; border:1px solid #cbd5e1; font-size:1rem; outline:none;">' +
          '<button class="btn" onclick="processYtVideo()" style="padding:12px 24px; border-radius:12px;">📥 Скачать</button>' +
        '</div>' +
        '<div id="ytToolResult" style="display:none; margin-top:20px;"></div>' +
      '</div>';

    } else if (type === 'video') {
      var videos = getRandomVideos(6);

    html += '</div>';
    main.innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.processYtVideo = function() {
    var url = document.getElementById('ytUrlInput').value.trim();
    var resDiv = document.getElementById('ytToolResult');

    if (!url) {
      toast('Вставьте ссылку на YouTube!', 'error');
      return;
    }

    var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    var match = url.match(regExp);
    var videoId = (match && match[2].length === 11) ? match[2] : null;

    if (!videoId) {
      toast('Некорректная ссылка на YouTube!', 'error');
      return;
    }

    resDiv.style.display = 'block';
    
    var downloadCobalt = 'https://cobalt.tools/?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + videoId);
    var downloadY2mate = 'https://www.y2mate.com/youtube/' + videoId;
    var downloadSs = 'https://ssyoutube.com/watch?v=' + videoId;

    var htmlRes = '<div style="background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:16px;">' +
      '<div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">' +
        '<img src="https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg" style="width:200px; height:115px; object-fit:cover; border-radius:10px; border:1px solid #cbd5e1;">' +
        '<div style="flex:1; min-width:220px;">' +
          '<h3 style="font-size:1.1rem; font-weight:800; color:var(--gray-900); margin-bottom:6px;">YouTube Video ID: ' + videoId + '</h3>' +
          '<p style="font-size:0.85rem; color:var(--gray-500); margin-bottom:12px;">Выберите удобный сервис для скачивания:</p>' +
          '<div style="display:flex; gap:10px; flex-wrap:wrap;">' +
            '<a href="' + downloadCobalt + '" target="_blank" class="btn" style="padding:10px 18px; font-size:0.88rem;">📥 Скачать MP4 (Cobalt API)</a>' +
            '<a href="' + downloadY2mate + '" target="_blank" class="btn btn-secondary" style="padding:10px 18px; font-size:0.88rem;">🎵 Скачать MP3 (Y2Mate)</a>' +
            '<a href="' + downloadSs + '" target="_blank" class="btn btn-secondary" style="padding:10px 18px; font-size:0.88rem;">🎬 Скачать через SaveFrom</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

    resDiv.innerHTML = htmlRes;
    toast('Ссылки для скачивания готовы!', 'success');
  };

function scrollToSection(id) {
  var el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function toggleSearch() {
  var modal = document.getElementById('searchModal');
  modal.classList.toggle('active');
  if (modal.classList.contains('active')) {
    document.getElementById('searchInput').focus();
  }
}

function doSearch() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var results = document.getElementById('searchResults');

  if (!q) { results.innerHTML = ''; return; }

  var items = [];

  data.pages.forEach(function(p) {
    if (p.title.toLowerCase().indexOf(q) !== -1 || p.content.toLowerCase().indexOf(q) !== -1) {
      items.push({ title: p.title, type: 'Страница', action: function() { toggleSearch(); showPage(p.id); } });
    }
  });

  data.cards.forEach(function(c) {
    if (c.title.toLowerCase().indexOf(q) !== -1 || c.desc.toLowerCase().indexOf(q) !== -1) {
      items.push({ title: c.title, type: 'Карточка', action: function() { toggleSearch(); } });
    }
  });

  data.navLinks.forEach(function(l) {
    if (l.text.toLowerCase().indexOf(q) !== -1) {
      items.push({ title: l.text, type: 'Ссылка', action: function() { toggleSearch(); } });
    }
  });

  results.innerHTML = items.length ? items.map(function(item, i) {
    return '<div class="search-result-item" onclick="searchActions[' + i + ']()">' +
      '<div class="sr-title">' + item.title + '</div>' +
      '<div class="sr-type">' + item.type + '</div>' +
    '</div>';
  }).join('') : '<div style="padding:20px;text-align:center;color:var(--gray-500);">Ничего не найдено</div>';

  window.searchActions = items.map(function(i) { return i.action; });
}

function toast(msg, type) {
  type = type || '';
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('searchModal').classList.contains('active')) toggleSearch();
  }
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); toggleSearch(); }
});

function toggleMobileMenu() {
  var nav = document.getElementById('mobileNav');
  var overlay = document.getElementById('mobileOverlay');
  var hamburger = document.querySelector('.hamburger');
  
  console.log('toggleMobileMenu called');
  console.log('nav:', nav);
  console.log('overlay:', overlay);
  console.log('hamburger:', hamburger);
  
  var isOpen = nav.classList.contains('open');
  if (isOpen) {
    nav.classList.remove('open');
    overlay.classList.remove('active');
    hamburger.classList.remove('active');
    document.body.style.overflow = '';
  } else {
    nav.classList.add('open');
    overlay.classList.add('active');
    hamburger.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
}

function renderMobileNav() {
  var dropdown = document.getElementById('mobileNavDropdown');
  dropdown.innerHTML = data.pages.map(function(p) {
    return '<a class="mobile-nav-link" onclick="showPage(' + p.id + '); toggleMobileMenu()">' + p.title + '</a>';
  }).join('');
}

let currentGameId = null;

function showToast(message, type = 'success') {
  var toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.remove('success', 'error');
  if (type) toast.classList.add(type);
  toast.classList.add('show');
  
  setTimeout(function() {
    toast.classList.remove('show');
  }, 3000);
}

function openGameModal(gameId) {
  currentGameId = gameId;
  var game = data.cards.find(function(c) { return c.id === gameId; });
  
  if (!game) return;
  
  document.getElementById('gameTitle').textContent = game.title;
  document.getElementById('gameDesc').textContent = game.desc;
  
  var downloadBtn = document.getElementById('downloadBtn');
  var playBtn = document.getElementById('playBrowserBtn');
  
  // Показываем/скрываем кнопку скачивания
  if (game.downloadLink && game.downloadLink !== '') {
    downloadBtn.style.display = 'flex';
  } else {
    downloadBtn.style.display = 'none';
  }
  
  // Показываем/скрываем кнопку игры в браузере
  if (game.browserAvailable) {
    playBtn.style.display = 'flex';
  } else {
    playBtn.style.display = 'none';
  }
  
  document.getElementById('gameModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeGameModal() {
  document.getElementById('gameModal').classList.remove('active');
  document.body.style.overflow = 'auto';
  currentGameId = null;
}

function downloadGame() {
  if (!currentGameId) return;
  var game = data.cards.find(function(c) { return c.id === currentGameId; });
  if (game && game.downloadLink) {
    window.open(game.downloadLink, '_blank');
    showToast('⬇️ Загрузка началась!', 'success');
    closeGameModal();
  }
}

function playInBrowser() {
  if (!currentGameId) return;
  var game = data.cards.find(function(c) { return c.id === currentGameId; });
  if (game && game.browserLink) {
    window.location.href = game.browserLink;
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('gameModal').classList.contains('active')) {
    closeGameModal();
  }
});

document.getElementById('gameModal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeGameModal();
  }
});

loadData();
render();
renderMobileNav();

// Версия файла для обновления кэша
