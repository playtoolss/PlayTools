<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Flip - PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { max-width: 850px; width:100%; background: #111827; border-radius: 20px; padding: 25px; border: 1px solid #34d399; box-shadow: 0 0 30px rgba(52,211,153,0.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#34d399; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(52,211,153,0.1); border-radius:999px; margin-bottom:15px; }
.game-container { position:relative; width:100%; height:400px; margin:20px 0; background:#050811; border-radius:12px; overflow:hidden; border:2px solid #34d399; }
#grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:24px; height:100%; }
.tile { border-radius:16px; cursor:pointer; transition: transform .15s ease; }
.tile:active { transform: scale(0.92); }
.hud { position:absolute; top:15px; left:20px; right:20px; display:flex; justify-content:space-between; font-weight:800; font-size:1.3rem; color:#34d399; pointer-events:none; z-index:10; }
.overlay { position:absolute; inset:0; background:rgba(9,13,22,0.85); backdrop-filter:blur(5px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
.btn { background: linear-gradient(135deg, #34d399, #22d3ee); color:#fff; border:none; padding:12px 30px; font-weight:800; font-size:1.1rem; border-radius:999px; cursor:pointer; margin-top:15px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>🎨 Color Flip</h1>
  <p>Нажми на клетку другого цвета. Не ошибись — таймер восстановится!</p>
  <div class="game-container">
    <div class="hud">
      <div id="score">Счёт: 0</div>
      <div id="timer">Время: 5.0</div>
    </div>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle">Color Flip</h2>
      <p id="ovSub">Нажимай на необычную клетку!</p>
      <button class="btn" id="startBtn">Старт</button>
    </div>
    <div id="grid"></div>
  </div>
</div>
<script>
const gridEl = document.getElementById('grid');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const startBtn = document.getElementById('startBtn');

let state = 'START';
let score = 0, timeLeft = 5;
let tiles = [], wrong = -1, lastTs = 0;

const COLORS = ['#f43f5e', '#f59e0b', '#22d3ee', '#a855f7', '#34d399', '#60a5fa'];

function build() {
  const base = COLORS[Math.floor(Math.random()*COLORS.length)];
  let glow = base;
  let idx = Math.floor(Math.random()*16);
  while (true) {
    glow = COLORS[Math.floor(Math.random()*COLORS.length)];
    if (glow !== base) break;
  }
  tiles = new Array(16).fill(base);
  tiles[idx] = glow;
  wrong = idx;
}

function render() {
  gridEl.innerHTML = '';
  tiles.forEach((c, i) => {
    const d = document.createElement('div');
    d.style.background = c;
    d.style.opacity = '0.85';
    if (i === wrong) d.style.opacity = '1';
    d.onclick = () => {
      if (state !== 'PLAYING') return;
      if (i === wrong) {
        score++;
        scoreEl.textContent = `Счёт: ${score}`;
        timeLeft = Math.min(5, timeLeft + 0.5);
        build(); render();
      } else {
        gameOver('Не туда!');
      }
    };
    gridEl.appendChild(d);
  });
}

startBtn.addEventListener('click', start);
overlay.addEventListener('click', start);

function start() { score = 0; timeLeft = 5; scoreEl.textContent='Счёт: 0'; timerEl.textContent='Время: 5.0'; build(); render(); state='PLAYING'; overlay.style.display='none'; }

function gameOver(msg) {
  state = 'GAMEOVER';
  ovTitle.textContent = msg + ' 🎨'; ovSub.textContent = `Счёт: ${score}`;
  startBtn.textContent = 'Ещё раз'; overlay.style.display = 'flex';
}

function loop(ts) {
  if (state === 'PLAYING') {
    if (!lastTs) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    timeLeft -= dt;
    timerEl.textContent = 'Время: ' + timeLeft.toFixed(1);
    if (timeLeft <= 0) { gameOver('Время вышло!'); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
