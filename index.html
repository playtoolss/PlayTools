<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официальное заявление</title>
    <style>
        /* Сбрасываем базовые отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        /* Настройки hero-секции */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Легкий градиент для фона */
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
        }

        /* Настройки текста */
        h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: #ff3333; /* Агрессивный красный цвет для выразительности */
            text-shadow: 0 4px 20px rgba(255, 51, 51, 0.3);
            padding: 0 20px;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <h1>playtools хуйня</h1>
    </section>

</body>
</html>
