<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jet Boost - PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { max-width: 850px; width:100%; background: #111827; border-radius: 20px; padding: 25px; border: 1px solid #a855f7; box-shadow: 0 0 30px rgba(168,85,247,0.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#a855f7; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(168,85,247,0.1); border-radius:999px; margin-bottom:15px; }
.game-container { position:relative; width:100%; height:400px; margin:20px 0; background:#050811; border-radius:12px; overflow:hidden; border:2px solid #a855f7; }
canvas { width:100%; height:100%; display:block; }
.hud { position:absolute; top:15px; left:20px; right:20px; display:flex; justify-content:space-between; font-weight:800; font-size:1.3rem; color:#a855f7; pointer-events:none; z-index:10; }
.overlay { position:absolute; inset:0; background:rgba(9,13,22,0.85); backdrop-filter:blur(5px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
.btn { background: linear-gradient(135deg, #a855f7, #7c6cff); color:#fff; border:none; padding:12px 30px; font-weight:800; font-size:1.1rem; border-radius:999px; cursor:pointer; margin-top:15px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>🚀 Jet Boost</h1>
  <p>Удерживай Пробел, чтобы лететь. Обходи препятствия!</p>
  <div class="game-container">
    <div class="hud">
      <div id="score">Счёт: 0</div>
      <div id="highScore">Рекорд: 0</div>
    </div>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle">Jet Boost</h2>
      <p id="ovSub">Держи Пробел для подъёма. Отпусти — падение!</p>
      <button class="btn" id="startBtn">Старт</button>
    </div>
    <canvas id="canvas" width="800" height="400"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovSub = document.getElementById('ovSub');
const startBtn = document.getElementById('startBtn');

let state = 'START';
let score = 0, highScore = localStorage.getItem('jet_boost_hi') || 0;
highScoreEl.textContent = `Рекорд: ${highScore}`;
let bird = { y: 170, vy: 0 };
let walls = [], frame = 0;
let holding = false;

window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); holding = true; if (state === 'START') start(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });
canvas.addEventListener('mousedown', e => { holding = true; if (state === 'START') start(); });
window.addEventListener('mouseup', () => holding = false);
startBtn.addEventListener('click', start);

function start() { bird.y = 170; bird.vy = 0; walls = []; score = 0; frame = 0; scoreEl.textContent='Счёт: 0'; state='PLAYING'; overlay.style.display='none'; }

function gameOver() {
  state = 'GAMEOVER';
  if (score > highScore) { highScore = score; localStorage.setItem('jet_boost_hi', highScore); highScoreEl.textContent = `Рекорд: ${highScore}`; }
  ovTitle.textContent = 'Разбился! 💥'; ovSub.textContent = `Счёт: ${score}`;
  startBtn.textContent = 'Ещё раз'; overlay.style.display = 'flex';
}

function update() {
  if (state !== 'PLAYING') return;
  frame++;
  score = Math.floor(frame / 10);
  scoreEl.textContent = `Счёт: ${score}`;

  bird.vy += holding ? -0.6 : 0.55;
  bird.y += bird.vy;
  if (bird.y < 10) { bird.y = 10; bird.vy = 0; }
  if (bird.y > 390) { gameOver(); }

  if (frame % 70 === 0) {
    let gap = 130;
    let gy = 60 + Math.random() * 220;
    walls.push({ x: 800, top: gy, bot: gy + gap });
  }

  for (let i = walls.length - 1; i >= 0; i--) {
    let w = walls[i];
    w.x -= 5 + score / 300;
    if (w.x < 45 && w.x + 50 > 30) {
      if (bird.y < w.top || bird.y > w.bot) { gameOver(); }
    }
    if (w.x + 50 < 0) walls.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = '#050811'; ctx.fillRect(0,0,800,400);
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 14;
  ctx.fillStyle = holding ? '#7c6cff' : '#22d3ee';
  ctx.beginPath(); ctx.arc(60, bird.y, 16, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ff0055';
  walls.forEach(w => { ctx.fillRect(w.x, 0, 50, w.top - 6); ctx.fillRect(w.x, w.bot + 6, 50, 400 - w.bot - 6); });
  ctx.shadowBlur = 0;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
