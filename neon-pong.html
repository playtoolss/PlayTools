<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Neon Pong - PlayTools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #030712; color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.container { max-width: 850px; width:100%; background: #111827; border-radius: 20px; padding: 25px; border: 1px solid #38bdf8; box-shadow: 0 0 30px rgba(56,189,248,0.2); text-align:center; }
.back-btn { display:inline-flex; align-items:center; color:#38bdf8; font-weight:700; text-decoration:none; padding:8px 16px; background:rgba(56,189,248,0.1); border-radius:999px; margin-bottom:15px; }
.game-container { position:relative; width:100%; height:450px; margin:20px 0; background:#0b1329; border-radius:12px; overflow:hidden; border:2px solid #38bdf8; }
canvas { width:100%; height:100%; display:block; }
.hud { position:absolute; top:15px; left:20px; right:20px; display:flex; justify-content:space-between; font-weight:800; font-size:1.3rem; color:#38bdf8; pointer-events:none; z-index:10; }
.overlay { position:absolute; inset:0; background:rgba(3,7,18,0.85); backdrop-filter:blur(5px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
.btn { background: linear-gradient(135deg, #0284c7, #38bdf8); color:#fff; border:none; padding:12px 30px; font-weight:800; font-size:1.1rem; border-radius:999px; cursor:pointer; margin-top:15px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-btn">← Назад на главную</a>
  <h1>⚡ Neon Pong</h1>
  <p>Неоновый Понг против ИИ! Двигай ракетку мышкой или стрелками!</p>
  <div class="game-container">
    <div class="hud">
      <div id="pScore">Игрок: 0</div>
      <div id="aiScore">ИИ: 0</div>
    </div>
    <div id="overlay" class="overlay">
      <h2 id="ovTitle">Neon Pong</h2>
      <p id="ovSub">Забей 5 голов ИИ роботу!</p>
      <button class="btn" id="startBtn">Погнали</button>
    </div>
    <canvas id="canvas" width="800" height="450"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const pScoreEl = document.getElementById('pScore');
const aiScoreEl = document.getElementById('aiScore');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let state = 'START', pScore = 0, aiScore = 0;
let player = { y: 175, h: 100, w: 14 };
let ai = { y: 175, h: 100, w: 14, speed: 4 };
let ball = { x: 400, y: 225, vx: 5, vy: 3, r: 8 };

canvas.addEventListener('mousemove', e => {
  let r = canvas.getBoundingClientRect();
  player.y = e.clientY - r.top - player.h/2;
});

startBtn.addEventListener('click', start);

function resetBall() {
  ball.x = 400; ball.y = 225; ball.vx = (Math.random()>0.5?1:-1)*5; ball.vy = (Math.random()-0.5)*6;
}

function start() {
  pScore = 0; aiScore = 0; pScoreEl.textContent = `Игрок: 0`; aiScoreEl.textContent = `ИИ: 0`;
  resetBall(); state = 'PLAYING'; overlay.style.display = 'none';
}

function gameOver(win) {
  state = 'GAMEOVER';
  document.getElementById('ovTitle').textContent = win ? '🎉 Ты Победил ИИ!' : '🤖 ИИ Одержал Победу!';
  document.getElementById('ovSub').textContent = `Счёт: ${pScore} - ${aiScore}`;
  startBtn.textContent = 'Ещё раз'; overlay.style.display = 'flex';
}

function update() {
  if (state !== 'PLAYING') return;

  ball.x += ball.vx; ball.y += ball.vy;

  // AI Movement
  if (ai.y + ai.h/2 < ball.y - 10) ai.y += ai.speed;
  else if (ai.y + ai.h/2 > ball.y + 10) ai.y -= ai.speed;

  if (ball.y - ball.r < 0 || ball.y + ball.r > 450) ball.vy *= -1;

  // Player Paddle Hit
  if (ball.x - ball.r <= 34 && ball.y >= player.y && ball.y <= player.y + player.h) {
    ball.vx = Math.abs(ball.vx) + 0.3;
  }

  // AI Paddle Hit
  if (ball.x + ball.r >= 766 && ball.y >= ai.y && ball.y <= ai.y + ai.h) {
    ball.vx = -Math.abs(ball.vx) - 0.3;
  }

  // Score
  if (ball.x < 0) {
    aiScore++; aiScoreEl.textContent = `ИИ: ${aiScore}`;
    if (aiScore >= 5) gameOver(false); else resetBall();
  }
  if (ball.x > 800) {
    pScore++; pScoreEl.textContent = `Игрок: ${pScore}`;
    if (pScore >= 5) gameOver(true); else resetBall();
  }
}

function draw() {
  ctx.fillStyle = '#0b1329'; ctx.fillRect(0,0,800,450);

  // Center Line
  ctx.strokeStyle = 'rgba(56,189,248,0.2)'; ctx.lineWidth = 4; ctx.setLineDash([10, 10]);
  ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 450); ctx.stroke(); ctx.setLineDash([]);

  // Paddles
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(20, player.y, player.w, player.h);
  ctx.fillStyle = '#f43f5e'; ctx.fillRect(766, ai.y, ai.w, ai.h);

  // Ball
  ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
